<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Assistant Chatbot</title>
    <link rel="icon" href="frontend/static/img/icon.png" type="image/png">
    <link rel="stylesheet" href="frontend/static/css/chatbot.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2>Menu</h2>
            <ul>
                <li><a href="#option1">Home</a></li>
                <li><a href="#option2">About</a></li>
                <li><a href="#option3">Help</a></li>
                <li><a href="#option4">Settings</a></li>
            </ul>
            <div class="user-panel">
                <p class="username">Logged in as: <span>{{ user_name }}</span></p>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </aside>

        <main class="chat-area">
            <header class="chat-header">
                <h1>Mental Health Assistant Chatbot</h1>
            </header>
            <section class="chat-container">
                <div class="chat-box" id="chat-box"></div>
                <form id="chat-form" action="{{ url_for('api.ai_assistant_page') }}" method="POST">
                    <label for="model">Choose a Model:</label>
                    <select name="model" id="model" required>
                        <option value="" disabled>Select a model</option>
                        {% for model_name in models %}
                            <option value="{{ model_name }}" {% if loop.first %}selected{% endif %}>{{ model_name }}</option>
                        {% endfor %}
                    </select>
                    <textarea id="message-input" name="input_text" placeholder="Type your message here..." required></textarea>
                    <button type="submit" class="send-btn">Send</button>
                </form>
            </section>
        </main>
    </div>
    <script src="frontend/js/chatbot.js"></script>
</body>
</html>
