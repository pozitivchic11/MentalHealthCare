<div id="login-modal" class="modal">
    <div class="modal-content">
        <button class="modal-close-login">&times;</button> <!-- Close button -->
        <h2>Welcome back!</h2>

        <div id="login-message" class="login-message"></div>

        <label for="login-username">Email</label>
        <input type="text" id="login-username" placeholder="Email" required>

        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="Password" required>

        <button class="btn-login" id="btn-login">Login</button>

        <p class="signup-text">Don't have an account? <a href="#" id="switch-to-signup">Sign up</a></p>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('btn-login').addEventListener('click', function(event) {
            event.preventDefault();

            const email = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const loginMessage = document.getElementById('login-message');

            if (!email || !password) {
                loginMessage.textContent = 'Email and Password are required.';
                loginMessage.style.color = 'red';
                loginMessage.style.fontWeight = 'bold';
                return;
            }

            fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email, password })
            })
            .then(response => {
                console.log(`Response status: ${response.status}`);
                if (response.status === 200) {
                    return response.json();
                } else if (response.status === 401) {
                    throw new Error('Invalid email or password');
                } else {
                    throw new Error(`Unexpected error: Status ${response.status}`);
                }
            })
            .then(data => {
                loginMessage.textContent = 'Login successful!';
                loginMessage.style.color = 'green';
                loginMessage.style.fontWeight = 'bold';

                setTimeout(() => {
                    window.location.href = '/test';
                }, 1000);
            })
            .catch(error => {
                console.error('Error:', error);
                loginMessage.textContent = error.message;
                loginMessage.style.color = 'red';
                loginMessage.style.fontWeight = 'bold';
            });
        });
    });
</script>
