<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Assistant Chatbot</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="frontend/static/css/chatbot.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2>Menu</h2>
            <ul>
                <li><a href="#option1">Home</a></li>
                <li><a href="#option2">About</a></li>
                <li><a href="#option3">Help</a></li>
                <li><a href="#option4">Settings</a></li>
            </ul>
        </aside>

        <main class="chat-area">
            <header class="chat-header">
                <h1>Mental Health Assistant Chatbot</h1>
            </header>
            <section class="chat-container">
                <div class="chat-box" id="chat-box"></div>
                <form id="chat-form" action="{{ url_for('api.test_page') }}" method="POST">
                    <label for="model">Choose a Model:</label>
                    <select name="model" id="model" required>
                        <option value="" disabled>Select a model</option>
                        {% for model_name in models %}
                            <option value="{{ model_name }}" {% if loop.first %}selected{% endif %}>{{ model_name }}</option>
                        {% endfor %}
                    </select>
                    <textarea id="message-input" name="input_text" placeholder="Type your message here..." required></textarea>
                    <button type="submit" class="send-btn">Send</button>
                </form>
            </section>
        </main>
    </div>
    <script>
        const form = document.getElementById("chat-form");
        const chatBox = document.getElementById("chat-box");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const messageInput = document.getElementById("message-input");
            const modelSelect = document.getElementById("model");
            const userMessage = messageInput.value.trim();
            const selectedModel = modelSelect.value;

            if (userMessage && selectedModel) {
                const userBubble = document.createElement("div");
                userBubble.className = "chat-bubble user";
                userBubble.textContent = userMessage;
                chatBox.appendChild(userBubble);

                chatBox.scrollTop = chatBox.scrollHeight;

                const formData = new FormData(form);

                try {
                    const response = await fetch(form.action, {
                        method: 'POST',
                        body: formData
                    });

                    if (response.ok) {
                        const reader = response.body.getReader();
                        let { value, done } = await reader.read();
                        let result = "";
                        while (!done) {
                            result += new TextDecoder().decode(value);
                            ({ value, done } = await reader.read());
                        }

                        const botBubble = document.createElement("div");
                        botBubble.className = "chat-bubble bot";
                        botBubble.textContent = result;
                        chatBox.appendChild(botBubble);
                    } else {
                        throw new Error("Error fetching response");
                    }
                } catch (error) {
                    const botBubble = document.createElement("div");
                    botBubble.className = "chat-bubble bot";
                    botBubble.textContent = "Error: Could not fetch bot response.";
                    chatBox.appendChild(botBubble);
                }

                messageInput.value = "";
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        });
    </script>
</body>
</html>
